[project]
name = "photocull-local-engine"
version = "0.2.1"
description = "Offline scene-aware and identity-aware photo culling engine"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.10,<5",
  "onnxruntime>=1.21,<2; platform_system != 'Windows'",
  "ai-edge-litert>=2.2,<3",
  "pillow-heif>=1.0,<2",
  "rawpy>=0.25,<1",
  "exifread>=3.5,<4"
]

[project.optional-dependencies]
cuda = [
  "onnxruntime-gpu[cuda,cudnn]>=1.24,<1.25; platform_system == 'Windows'"
]
directml = [
  "onnxruntime-directml>=1.21,<2; platform_system == 'Windows'"
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["photocull"]
